<script>
const plan=JSON.parse(document.getElementById('trailer-data').textContent);
const el=id=>document.getElementById(id),light={night:'夜间',day:'白天',sunset:'黄昏'};
const tc=frame=>{const s=frame/plan.delivery.fps;return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
let current=0;
const gallery=el('gallery');
for(const [i,s] of plan.shots.entries()){
 const b=document.createElement('button');b.className='shot';b.type='button';b.setAttribute('aria-pressed','false');b.setAttribute('aria-label',`${s.id} ${s.title} ${tc(s.startFrameInclusive)} 至 ${tc(s.endFrameExclusive)}`);
 const img=document.createElement('img');img.src=s.references[0].image;img.alt=s.title+'的实机参考';img.loading='lazy';
 const label=document.createElement('span');label.className='label';label.textContent=s.id+' · '+s.title;
 const time=document.createElement('small');time.textContent=tc(s.startFrameInclusive)+'–'+tc(s.endFrameExclusive)+' / '+s.durationSeconds+' 秒';
 b.append(img,label,time);b.addEventListener('click',()=>selectShot(i));gallery.append(b);
}
function setReference(){const s=plan.shots[current],r=s.references[Number(el('reference').value)];el('hero').src=r.image;el('hero').alt=s.title+' · '+light[r.capturedLighting]+'实机勘景';el('caption').textContent=`目标光照：${light[s.lighting]} · 参考图光照：${light[r.capturedLighting]} · 原始画面 ${r.renderResolution.join(' × ')}${r.capturedLighting!==s.lighting?' · 此参考图与规划光照不同':''}`;}
function selectShot(i){current=i;const s=plan.shots[i];el('time').textContent=`镜头 ${s.id} / ${tc(s.startFrameInclusive)}–${tc(s.endFrameExclusive)} / ${s.durationSeconds} 秒`;el('shot-title').textContent=s.title;el('motion').textContent=s.motion;el('review').textContent=s.review;el('reference').replaceChildren();s.references.forEach((r,j)=>{const o=document.createElement('option');o.value=String(j);o.textContent=`${j+1} · ${light[r.capturedLighting]} · 机位 ${r.name.slice(0,2)}`;el('reference').append(o);});el('reference').disabled=s.references.length===1;[...gallery.children].forEach((b,j)=>b.setAttribute('aria-pressed',String(j===i)));setReference();}
el('reference').addEventListener('change',setReference);
el('evidence').textContent=`${plan.scout.captureCount} 张实机勘景 · ${plan.shots.length} 个规划镜头 · ${plan.delivery.totalFrames} 帧成片`;
selectShot(0);
</script>
